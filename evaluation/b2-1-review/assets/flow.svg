<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 490" role="img" aria-labelledby="title desc">
  <title id="title">거래 추가 명령의 실제 실행 흐름</title>
  <desc id="desc">CLI가 입력을 받고 서비스가 검증기를 사용해 거래를 만든 뒤 저장소가 JSONL 파일에 쓰고 결과가 CLI를 거쳐 사용자에게 출력된다.</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7 Z" fill="#536f8d"/></marker>
    <marker id="back" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7 Z" fill="#807f7a"/></marker>
  </defs>
  <rect width="1080" height="490" rx="10" fill="#f7f5f0"/>
  <text x="30" y="31" fill="#292929" font-family="Georgia,serif" font-size="18">예시 · add 명령이 저장되고 결과가 돌아오기까지</text>
  <text x="30" y="53" fill="#5e5d58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="12">python3 -m budget_app 실행 시 __main__.py가 cli.main()을 호출합니다.</text>
  <g stroke="#d5d0c7" stroke-width="1" stroke-dasharray="4 4">
    <line x1="140" y1="105" x2="140" y2="460"/><line x1="335" y1="105" x2="335" y2="460"/><line x1="530" y1="105" x2="530" y2="460"/><line x1="725" y1="105" x2="725" y2="460"/><line x1="920" y1="105" x2="920" y2="460"/>
  </g>
  <g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <rect x="71" y="70" width="138" height="36" rx="6" fill="#fffdf8" stroke="#536f8d"/><text x="140" y="93" fill="#292929">CLI</text>
    <rect x="266" y="70" width="138" height="36" rx="6" fill="#f0ede5" stroke="#536f8d"/><text x="335" y="93" fill="#292929">서비스</text>
    <rect x="461" y="70" width="138" height="36" rx="6" fill="#fffdf8" stroke="#d5d0c7"/><text x="530" y="93" fill="#292929">검증</text>
    <rect x="656" y="70" width="138" height="36" rx="6" fill="#fffdf8" stroke="#d5d0c7"/><text x="725" y="93" fill="#292929">저장소</text>
    <rect x="851" y="70" width="138" height="36" rx="6" fill="#fffdf8" stroke="#d5d0c7"/><text x="920" y="93" fill="#292929">데이터 파일</text>
  </g>
  <g stroke="#536f8d" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M30 142 H135"/><path d="M145 185 H330"/><path d="M340 231 H525"/><path d="M340 305 H720"/><path d="M730 348 H915"/>
  </g>
  <g stroke="#807f7a" stroke-width="1.3" stroke-dasharray="5 4" fill="none" marker-end="url(#back)">
    <path d="M525 266 H340"/><path d="M915 380 H730"/><path d="M720 402 H340"/><path d="M330 426 H145"/><path d="M135 454 H30"/>
  </g>
  <g fill="#292929" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="11">
    <text x="32" y="132">입력</text><text x="178" y="175">add_transaction 호출</text><text x="376" y="221">날짜·금액 등 확인</text><text x="379" y="296">검증된 거래 전달</text><text x="755" y="339">JSONL 한 줄 추가</text>
    <text x="365" y="257">검사 결과</text><text x="747" y="372">파일 기록</text><text x="459" y="394">저장 완료</text><text x="189" y="418">거래 id 반환</text><text x="33" y="445">출력</text>
  </g>
  <text x="30" y="481" fill="#5e5d58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="10">오류가 발생하면 decorators.py가 cli.main을 감싼 자리에서 안내 메시지를 출력합니다.</text>
</svg>
